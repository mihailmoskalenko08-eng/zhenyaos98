<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ЖеняOS 98</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: full-screen retro desktop — teal ground, bevelled grey windows, taskbar pinned to the bottom */
:root{
  --desk:#008080; --face:#c0c0c0; --face-lt:#dfdfdf; --hl:#ffffff; --sh:#808080; --dk:#0a0a0a;
  --title-a:#000080; --title-b:#1084d0; --title-off-a:#808080; --title-off-b:#b5b5b5;
  --ink:#000000; --paper:#ffffff; --sel:#000080; --sel-ink:#ffffff; --tip:#ffffe1;
  --bsod:#0000aa; --bsod-ink:#ffffff; --heart:#d81b4a; --lcd:#00e05a; --amp:#232338;
  --ui:Tahoma,"Segoe UI",Verdana,"MS Sans Serif",Arial,sans-serif;
  --pixel:"Pixelify Sans",Tahoma,Verdana,sans-serif;
  --mono:"PT Mono","Lucida Console","Courier New",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--desk);color:var(--ink);font:12px/1.35 var(--ui);-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:var(--ink)}
*{box-sizing:border-box}
:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}

.out{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--face-lt)}
.in{background:var(--paper);box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--face-lt),inset 2px 2px var(--dk)}
.btn{background:var(--face);border:0;min-width:75px;min-height:23px;padding:3px 10px;cursor:pointer;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hl),inset -2px -2px var(--sh),inset 2px 2px var(--face-lt)}
.btn:active,.btn.on{box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--dk),inset -2px -2px var(--face-lt),inset 2px 2px var(--sh);padding:4px 9px 2px 11px}
.btn:disabled{color:var(--sh);text-shadow:1px 1px var(--hl);cursor:default}
.field{border:0;padding:3px 4px;font:inherit;background:var(--paper);color:var(--ink);box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--face-lt),inset 2px 2px var(--dk);user-select:text;-webkit-user-select:text}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:9000;cursor:pointer;padding-inline:16px}
.logo{display:flex;align-items:center;gap:18px}
.logo svg{width:84px;height:84px;filter:drop-shadow(0 0 18px #d81b4a88)}
.logo .wm{font:700 54px/1 var(--pixel);letter-spacing:.02em}
.logo .wm small{display:block;font:400 18px/1.4 var(--pixel);letter-spacing:.32em;color:#9fd8ff}
.logo .wm sup{font-size:26px;color:#ff6f91;vertical-align:top}
.bootbar{width:min(260px,80vw);height:18px;border:2px solid #555;padding:2px;overflow:hidden}
.bootbar i{display:block;height:100%;width:40%;background:repeating-linear-gradient(90deg,#1084d0 0 10px,transparent 10px 13px);animation:slide 1.4s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#boot .press{font:400 16px var(--pixel);color:#bbb;min-height:1.4em}
#boot .press.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;background:var(--desk);display:flex;align-items:center;justify-content:center;z-index:8000;padding-inline:16px}

/* ---------- desktop ---------- */
#desk{position:fixed;inset:0 0 30px 0;background:var(--desk) url(media/wall.jpg) center/cover no-repeat;overflow:hidden}
#icons{position:absolute;inset:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,78px);grid-auto-columns:92px;justify-items:center;align-items:start;gap:4px 4px}
.ico{width:88px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default;text-align:center;border:1px dotted transparent}
.ico svg{width:32px;height:32px;flex:none}
.ico span{padding:0 2px;line-height:1.25;word-break:break-word;color:var(--ink)}
#icons .ico span{color:var(--hl);text-shadow:1px 1px 0 #000,0 0 3px #000}
.ico.sel svg{filter:brightness(.55) sepia(1) hue-rotate(190deg) saturate(5)}
.ico.sel span{background:var(--sel);color:var(--sel-ink)!important;text-shadow:none}
.ico:focus-visible{outline:none;border-color:var(--hl)}

/* ---------- windows ---------- */
.win{position:absolute;display:flex;flex-direction:column;padding:3px;min-width:200px;max-width:calc(100vw - 8px);max-height:calc(100% - 4px)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;max-height:none}
.tb{display:flex;align-items:center;gap:4px;height:20px;padding:0 2px 0 3px;background:linear-gradient(90deg,var(--title-off-a),var(--title-off-b));color:var(--face-lt);font-weight:700;cursor:default;touch-action:none;flex:none}
.win.act .tb{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--hl)}
.tb svg.ti{width:16px;height:16px;flex:none}
.tb .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:18px;height:16px;min-width:0;min-height:0;padding:0;display:grid;place-items:center;flex:none}
.tbtn:active{padding:1px 0 0 1px}
.tbtn svg{width:9px;height:9px}
.tbtn.x{margin-left:2px}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:2px;gap:2px}
.menubar{display:flex;gap:2px;padding:1px 0;flex:none}
.menubar span{padding:1px 6px}
.menubar span:first-letter{text-decoration:underline}
.addr{display:flex;align-items:center;gap:6px;padding:2px 2px 3px;flex:none}
.addr .field{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{flex:1;min-height:0;overflow:auto;padding:6px}
.grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.status{display:flex;gap:2px;flex:none}
.status span{flex:1;padding:2px 4px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh)}
.status span:last-child{flex:0 0 40%}

/* notepad */
.np{flex:1;min-height:0;resize:none;border:0;padding:6px 8px;font:14px/1.5 var(--mono);color:var(--ink);background:var(--paper);white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.np:focus{outline:none}

/* image viewer */
.viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#202020;padding:6px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.vbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px;flex:none}
.vbar .cnt{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

/* video */
.vid{flex:1;display:flex;align-items:center;justify-content:center;background:#000;padding:14px}
.vid video{width:min(300px,70vw);aspect-ratio:1;border-radius:50%;object-fit:cover;background:#111;box-shadow:0 0 0 3px #fff3}

/* dialogs */
#modal{position:absolute;inset:0;z-index:7000;background:transparent}
.dlg .dbody{display:flex;gap:14px;padding:14px 12px 8px;align-items:flex-start}
.dlg .dbody svg.big{width:32px;height:32px;flex:none}
.dlg .dtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dlg .q{font-weight:700}
.dlg .row{display:flex;align-items:center;gap:8px}
.dlg .row label{min-width:96px}
.dlg .row .field{flex:1;min-width:0}
.dlg .err{color:#a00000;min-height:1.3em}
.dlg .hint{background:var(--tip);border:1px solid var(--ink);padding:4px 6px}
.dlg .btns{display:flex;justify-content:flex-end;gap:6px;padding:4px 12px 12px;flex-wrap:wrap}
.slots{display:flex;gap:4px}
.slots b{width:24px;height:28px;display:grid;place-items:center;font:700 16px var(--mono);background:var(--paper);box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh),inset -2px -2px var(--face-lt),inset 2px 2px var(--dk)}
.slots b.no{color:var(--sh)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* login dialog extra */
.loginart{height:64px;margin:3px 3px 0;background:linear-gradient(90deg,var(--title-a),var(--title-b));display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff}
.loginart svg{width:36px;height:36px}
.loginart b{font:700 26px var(--pixel)}
.loginart small{font:400 13px var(--pixel);letter-spacing:.2em;opacity:.85}

/* ---------- taskbar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;gap:4px;padding:2px 2px 0;z-index:6000;box-shadow:inset 0 1px var(--face-lt),inset 0 2px var(--hl)}
#bar{padding-bottom:env(safe-area-inset-bottom,0px)}
#start{display:flex;align-items:center;gap:4px;font-weight:700;min-width:0;padding:2px 6px;height:24px}
#start svg{width:16px;height:16px}
#tasks{flex:1;min-width:0;display:flex;gap:3px;overflow:hidden}
.task{flex:0 1 160px;min-width:40px;height:24px;display:flex;align-items:center;gap:4px;text-align:left;padding:2px 6px;overflow:hidden}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task svg{width:16px;height:16px;flex:none}
.task.on{font-weight:700;background:repeating-conic-gradient(var(--face) 0 25%,var(--hl) 0 50%) 0 0/2px 2px}
#tray{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;box-shadow:inset -1px -1px var(--hl),inset 1px 1px var(--sh);flex:none}
#tray button{background:none;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
#tray svg{width:16px;height:16px}
#clock{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
#balloon{position:fixed;right:8px;bottom:38px;max-width:min(300px,calc(100vw - 16px));background:var(--tip);border:1px solid var(--ink);padding:8px 10px;z-index:6500;box-shadow:2px 2px 0 #0004;display:flex;flex-direction:column;gap:3px}
#balloon b{display:flex;align-items:center;gap:6px}
#balloon b svg{width:16px;height:16px}

/* start menu */
#smenu{position:fixed;left:2px;bottom:30px;display:flex;padding:3px;z-index:6600;min-width:220px}
#smenu .side{width:24px;background:linear-gradient(0deg,var(--title-a),var(--title-b));color:var(--hl);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
#smenu .side b{writing-mode:vertical-rl;transform:rotate(180deg);font:700 17px var(--pixel);letter-spacing:.06em}
#smenu .side b span{color:#9fd8ff;font-weight:400}
#smenu ul{list-style:none;margin:0;padding:0;flex:1}
#smenu li{display:flex;align-items:center;gap:10px;padding:5px 18px 5px 6px;cursor:pointer}
#smenu li svg{width:24px;height:24px}
#smenu li:hover,#smenu li:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
#smenu hr{border:0;border-top:1px solid var(--sh);border-bottom:1px solid var(--hl);margin:3px 2px}

/* ---------- player ---------- */
.amp{background:var(--amp);color:var(--lcd);padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.amp .lcd{background:#000;border:1px solid #3a3a5a;padding:6px 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.amp .time{font:700 26px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.amp .marq{overflow:hidden;white-space:nowrap;font:13px var(--mono)}
.amp .marq span{display:inline-block;padding-left:100%;animation:marq 14s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.amp canvas{grid-column:1/-1;width:100%;height:46px;display:block}
.amp .meta{font:11px var(--mono);color:#8fe3b0;display:flex;gap:10px;grid-column:1/-1}
.amp input[type=range]{width:100%;accent-color:var(--lcd)}
.amp .ctl{display:flex;gap:4px;align-items:center}
.amp .ctl .btn{min-width:34px;padding:2px 6px}
.amp .ctl .vol{flex:1;display:flex;align-items:center;gap:6px;color:#8fe3b0;font:11px var(--mono)}
.amp .pl{background:#000;border:1px solid #3a3a5a;font:12px var(--mono);padding:4px 6px;color:var(--lcd);display:flex;justify-content:space-between}

/* ---------- minesweeper ---------- */
.ms{padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;flex:1}
.ms .top{align-self:stretch}
.ms .top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.ms .led{background:#000;color:#ff2a2a;font:700 22px/1 var(--mono);padding:2px 4px;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.ms .face{width:30px;height:30px;min-width:0;padding:0;font-size:17px;display:grid;place-items:center}
.ms .board{display:grid;padding:3px;touch-action:manipulation}
.ms .c{width:24px;height:24px;display:grid;place-items:center;font:700 14px var(--ui);cursor:default}
.ms .c.hid{background:var(--face);box-shadow:inset -2px -2px var(--sh),inset 2px 2px var(--hl)}
.ms .c.rev{background:var(--face);border-right:1px solid var(--sh);border-bottom:1px solid var(--sh)}
.ms .c.boom{background:#ff2a2a}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}

/* ---------- sysinfo ---------- */
.sys{display:flex;gap:18px;padding:16px;flex-wrap:wrap}
.sys .pic{width:120px;height:110px;display:grid;place-items:center}
.sys .pic svg{width:96px;height:96px}
.sys dl{margin:0;display:grid;grid-template-columns:auto;gap:2px;flex:1;min-width:200px}
.sys dt{font-weight:700;margin-top:8px}
.sys dt:first-child{margin-top:0}
.sys dd{margin:0 0 0 14px}
.sys .key{font:700 13px var(--mono);background:var(--tip);padding:1px 4px;border:1px solid var(--sh)}

/* ---------- installer + bsod ---------- */
.inst{padding:14px;display:flex;flex-direction:column;gap:10px}
.inst .pbar{height:20px;padding:3px;display:flex;gap:2px;overflow:hidden}
.inst .pbar i{width:9px;flex:none;background:var(--sel)}
.inst .step{min-height:1.4em}
#bsod{position:fixed;inset:0;background:var(--bsod);color:var(--bsod-ink);z-index:9500;display:flex;align-items:center;justify-content:center;padding:24px max(16px,4vw);cursor:pointer}
#bsod .in2{max-width:720px;font:18px/1.55 var(--mono);display:flex;flex-direction:column;gap:18px}
#bsod .hd{align-self:center;background:var(--face);color:var(--bsod);padding:0 10px;font-weight:700}
#bsod .big{font:700 clamp(26px,5vw,44px)/1.15 var(--pixel);text-align:center}
#bsod .cur{animation:blink 1s steps(2) infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9400}

@media (max-width:700px){
  .win{left:2px!important;width:calc(100vw - 4px)!important}
  .logo .wm{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:0s!important;animation-iteration-count:1!important}
  .amp .marq span{padding-left:0}
}
</style>

<div id="boot" role="button" tabindex="0" aria-label="Запустить систему">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28C6 20 3 15.5 3 11c0-3.6 2.9-6.5 6.3-6.5 2.9 0 4.9 1.8 6.7 4.3 1.8-2.5 3.8-4.3 6.7-4.3C26.1 4.5 29 7.4 29 11c0 4.5-3 9-13 17z" fill="#d81b4a"/><path d="M8 10.5c0-1.7 1.2-3 2.8-3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <div class="wm">ЖеняOS<sup>98</sup><small>BIRTHDAY EDITION</small></div>
  </div>
  <div class="bootbar"><i></i></div>
  <div class="press" id="press">Загрузка…</div>
</div>

<div id="login" hidden></div>
<div id="desk" hidden><div id="icons"></div></div>
<div id="bar" class="out" hidden>
  <button id="start" class="btn" aria-haspopup="menu"></button>
  <div id="tasks"></div>
  <div id="tray">
    <button id="trayKey" title="Найденные буквы" aria-label="Найденные буквы"></button>
    <button id="trayVol" title="Плеер" aria-label="Открыть плеер"></button>
    <span id="clock">00:00</span>
  </div>
</div>
<div id="smenu" class="out" hidden role="menu"></div>
<div id="balloon" hidden></div>
<canvas id="fx" hidden></canvas>
<audio id="audio" src="media/kuduro.mp3" preload="auto" loop></audio>

<script>
(()=>{
/* ================= content ================= */
const HER = 'Женечка';
const WORD = ['А','У','Р','У','М'];

const LETTER = `Женечка,

С днём рождения!

Ровно два года назад, 17 ноября, на твоём дне рождения, мы впервые заговорили. А 8 декабря начали встречаться.

Да, я сделал тебе целую операционную систему, потому что обычная открытка для тебя слишком мелко.

Спасибо тебе за каждый день рядом. За твой смех, за то, как ты подмигиваешь на всех фотках, за терпение к моим странностям (то есть особенностям). С тобой даже обычная прогулка становится событием.

Хочу, чтобы этот год был для тебя самым лёгким, тёплым и счастливым. А я буду рядом, чтобы это проверить.

Люблю тебя ❤️❤️❤️
Твой Мишка`;

const GIFT = `ПОДАРОК.TXT

Квест пройден. Система взломана. Сердце тоже.

Сейчас я, конечно, не рядом, но мысленно обнимаю тебя очень-очень крепко.

А настоящие обнимашки и поцелуи за мной при первой же встрече :)`;

const README = `Привет, ${HER}!

Это твоя личная операционная система. Она работает только для тебя и только на любви (и немного на JavaScript).

Что тут есть:
  • «Мои фотографии»: ну ты поняла
  • «Плеер»: там классная песня, включи погромче
  • «Сапёр»: если станет скучно
  • «Корзина»: туда я выкинул всё плохое

А ещё тут спрятан квест. Как его пройти, написано в файле «Квест.txt».`;

const QUEST = `КВЕСТ.TXT

На рабочем столе лежат три закрытые папки. Пароли к ним знаешь только ты.

Пароль к последней папке «Для Женечки» состоит из 5 букв. Они спрятаны по системе. Найденные буквы видно по значку ключика в правом нижнем углу.

Открывай по порядку:

  1. «Корзина» → поищи внутри
  2. «Мой компьютер» → посмотри внимательно
  3. «Сапёр» → пройди поле
  4. Папка «Наше начало» → поищи внутри
  5. Папка «Семейный архив» → поищи внутри
  6. Папка «Для Женечки» → собери пароль из 5 букв
     и запусти то, что найдёшь внутри

Если застрянешь, в окне пароля есть кнопка «Подсказка».

Удачи! Я в тебя верю.`;

const DIG = s => (s||'').replace(/\D/g,'');
const NORM = s => (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я]/g,'');

const LOCKS = {
  login: { q:'Когда мы впервые заговорили?',
    hint:'В очень важный для тебя день. Можно ввести дату: ДД.ММ.ГГГГ',
    check:v=>['17112024','171124'].includes(DIG(v)) || /рожд|др/.test(NORM(v)) },
  start: { q:'Когда мы начали встречаться?',
    hint:'Зима, за пару недель до Нового года. Формат: ДД.ММ.ГГГГ',
    check:v=>['08122024','8122024','081224','81224'].includes(DIG(v)) },
  family:{ q:'Как отчество сына твоей тёти?',
    hint:'Вопрос шуточный, отчество тут ни при чём. Ответ из двух слов.',
    hint2:'Ладно, сдаюсь: «Не знаю»',
    check:v=>['незнаю','янезнаю'].includes(NORM(v)) },
  gift:  { q:'Пароль из 5 букв. Буквы спрятаны по системе.',
    hint:'Это название ресторана, в который нам подарили сертификат.',
    check:v=>['аурум','aurum'].includes(NORM(v)), slots:true }

const $=(s,r=document)=>r.querySelector(s);
function h(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  for(const k of kids.flat()) if(k!=null) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}

const desk=$('#desk'), tasks=$('#tasks');
const WM={wins:{},z:10,n:0,
  open(id,{title,icon,w=420,h=320,body,onclose,x,y,nomax}){
    if(this.wins[id]){ this.restore(id); return this.wins[id]; }
    const W=desk.clientWidth, H=desk.clientHeight;
    w=Math.min(w,W-8); h=Math.min(h,H-8);
    const k=this.n++%7;
    x = x ?? Math.max(4,Math.min(W-w-4, 110+k*26)); y = y ?? Math.max(4,Math.min(H-h-4, 30+k*24));
    const win=h_('div',{class:'win out',style:`left:${x}px;top:${y}px;width:${w}px;height:${h}px`});
    const tb=h_('div',{class:'tb'});
    tb.innerHTML=`${icon||''}<span class="tt"></span>`;
    tb.querySelector('svg')?.classList.add('ti');
    tb.querySelector('.tt').textContent=title;
    const bmin=h_('button',{class:'btn tbtn',html:TB.min,'aria-label':'Свернуть'});
    const bmax=h_('button',{class:'btn tbtn',html:TB.max,'aria-label':'Развернуть'});
    const bx=h_('button',{class:'btn tbtn x',html:TB.x,'aria-label':'Закрыть'});
    tb.append(bmin); if(!nomax) tb.append(bmax); tb.append(bx);
    const wb=h_('div',{class:'wbody'}); wb.append(body);
    win.append(tb,wb); desk.append(win);
    const task=h_('button',{class:'btn task',html:icon||''}); task.append(h_('span',{},title));
    tasks.append(task);
    const rec={id,win,task,onclose,title};
    this.wins[id]=rec;
    bmin.onclick=e=>{e.stopPropagation();this.minimize(id)};
    bmax.onclick=e=>{e.stopPropagation();win.classList.toggle('max')};
    bx.onclick=e=>{e.stopPropagation();this.close(id)};
    tb.ondblclick=()=>{ if(!nomax) win.classList.toggle('max') };
    task.onclick=()=>{ if(win.hidden) this.restore(id); else if(win.classList.contains('act')) this.minimize(id); else this.focus(id); };
    win.addEventListener('pointerdown',()=>this.focus(id));
    drag(tb,win);
    this.focus(id);
    return rec;
  },
  focus(id){ const r=this.wins[id]; if(!r) return;
    for(const o of Object.values(this.wins)){ o.win.classList.remove('act'); o.task.classList.remove('on'); }
    r.win.hidden=false; r.win.style.zIndex=id==='pw'?7100:++this.z; r.win.classList.add('act'); r.task.classList.add('on'); },
  restore(id){ this.focus(id); },
  minimize(id){ const r=this.wins[id]; r.win.hidden=true; r.win.classList.remove('act'); r.task.classList.remove('on'); },
  close(id){ const r=this.wins[id]; if(!r) return; r.onclose?.(); r.win.remove(); r.task.remove(); delete this.wins[id]; }
};
function h_(t,p,...k){ return h(t,p,...k); }
function drag(handle,win){
  let sx,sy,ox,oy,on=false;
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')||win.classList.contains('max')) return;
    on=true; sx=e.clientX; sy=e.clientY; ox=win.offsetLeft; oy=win.offsetTop; handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove',e=>{ if(!on) return;
    const W=desk.clientWidth,H=desk.clientHeight;
    win.style.left=Math.max(-win.offsetWidth+60,Math.min(W-60,ox+e.clientX-sx))+'px';
    win.style.top=Math.max(0,Math.min(H-24,oy+e.clientY-sy))+'px'; });
  handle.addEventListener('pointerup',()=>on=false);
  handle.addEventListener('pointercancel',()=>on=false);
}

function openItem(it){
  if(it.type==='folder'){
    const f=FOLDERS[it.id]; f.id=it.id;
    if(f.lock && !S.unlocked[it.id]) return askPassword(f.lock,`Папка «${f.title}» защищена паролем`,()=>{ S.unlocked[it.id]=true; save(); refreshIcons(); openFolder(it.id); });
    return openFolder(it.id);
  }
  if(it.type==='txt') return openNote(it.name,it.text,it.letter);
  if(it.type==='img') return openViewer(it._list||[it],it._idx||0);
  if(it.type==='video') return openVideo(it);
  if(it.type==='exe') return runInstaller();

}

/* ================= password dialog ================= */
function askPassword(lockId,title,ok,{modalParent}={}){
  const L=LOCKS[lockId]; let fails=0;
  const input=h('input',{class:'field',id:'pw-'+lockId,type:lockId==='login'?'password':'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false'});
  const err=h('div',{class:'err','aria-live':'polite'});
  const hintBox=h('div',{class:'hint',hidden:''});
  const slots = L.slots ? h('div',{class:'row'},h('label',{},'Найдено:'),h('div',{class:'slots'},WORD.map((c,i)=>h('b',{class:S.letters[i]?'':'no'},S.letters[i]?c:'?')))) : null;
  const row=h('div',{class:'row'},h('label',{for:input.id},'Пароль:'),input);
  const text=h('div',{class:'dtext'},h('div',{},title),h('div',{class:'q'},L.q),slots,row,hintBox,err);
  const bOk=h('button',{class:'btn'},'ОК'), bHint=h('button',{class:'btn'},'Подсказка'), bNo=h('button',{class:'btn'},'Отмена');
  const dlg=h('div',{class:'dlg',style:'display:flex;flex-direction:column'},
    h('div',{class:'dbody',html:ICON.locked.replace('<svg','<svg class="big"')},),
    h('div',{class:'btns'},bOk,bHint,bNo));
  dlg.firstChild.append(text);
  const showHint=t=>{ hintBox.hidden=false; hintBox.textContent='Подсказка: '+t; };
  bHint.onclick=()=>showHint(fails>=3&&L.hint2?L.hint2:L.hint);
  const submit=()=>{
    if(L.check(input.value)){ close(); ok(); return; }
    fails++; input.select();
    err.textContent = ['Неверный пароль. Попробуй ещё, '+HER+'.','Снова мимо. Посмотри подсказку.','Хм. Подумай ещё :)'][Math.min(fails-1,2)];
    dlg.parentElement.parentElement.classList.remove('shake'); void dlg.offsetWidth; dlg.parentElement.parentElement.classList.add('shake');
    if(fails===2) showHint(L.hint);
    if(fails>=3 && L.hint2) showHint(L.hint2);
  };
  bOk.onclick=submit; input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); if(e.key==='Escape') close(); });
  let rec, modal;
  const close=()=>{ if(lockId==='login') return; modal?.remove(); WM.close('pw'); };
  bNo.onclick=close;
  if(lockId==='login'){ return {dlg,input,bNo}; }
  modal=h('div',{id:'modal'}); desk.append(modal);
  if(WM.wins.pw) WM.close('pw');
  rec=WM.open('pw',{title:'Введите пароль',icon:ICON.key,w:430,h:L.slots?300:250,body:dlg,nomax:true,onclose:()=>modal.remove()});
  rec.win.style.zIndex=7100; rec.win.style.height='auto';
  const W=desk.clientWidth,H=desk.clientHeight;
  rec.win.style.left=Math.max(2,(W-rec.win.offsetWidth)/2)+'px'; rec.win.style.top=Math.max(2,(H-rec.win.offsetHeight)/2.4)+'px';
  setTimeout(()=>input.focus(),50);
}

  const fresh=!S.letters[i]; S.letters[i]=true; save();
  const got=WORD.map((c,k)=>S.letters[k]?c:'_').join(' ');
  balloon(fresh?`Найдена буква ${i+1} из 5: «${WORD[i]}»`:`Эта буква уже найдена: «${WORD[i]}»`,`Пароль: ${got}`);
}
let bt;
function balloon(title,text){
  const b=$('#balloon'); b.innerHTML=''; const t=h('b',{html:ICON.key}); t.append(title);
  b.append(t,h('span',{},text)); b.hidden=false; clearTimeout(bt); bt=setTimeout(()=>b.hidden=true,6500);
}

/* ---------- player ---------- */
const audio=$('#audio'); let actx,analyser,srcNode;
function fmt(t){ t=Math.max(0,t|0); return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function player(){
  if(WM.wins.player) return WM.restore('player');
  const time=h('div',{class:'time'},'00:00');
  const cv=h('canvas',{width:300,height:46});
  const seek=h('input',{type:'range',min:0,max:1000,value:0,id:'seek','aria-label':'Перемотка'});
  const vol=h('input',{type:'range',min:0,max:100,value:Math.round(audio.volume*100),id:'vol','aria-label':'Громкость'});
  const bPlay=h('button',{class:'btn','aria-label':'Играть'},'►'), bPause=h('button',{class:'btn','aria-label':'Пауза'},'❚❚'), bStop=h('button',{class:'btn','aria-label':'Стоп'},'■');
  const body=h('div',{class:'amp'},
    h('div',{class:'lcd'},time,h('div',{class:'marq'},h('span',{},'1. Lucenzo feat. Big Ali — Vem Dançar Kuduro ★ любимая песня ★ ')),cv,
      h('div',{class:'meta'},h('span',{},'256 kbps'),h('span',{},'44 kHz'),h('span',{},'стерео'))),
    seek,
    h('div',{class:'ctl'},bPlay,bPause,bStop,h('label',{class:'vol',for:'vol'},'VOL',vol)),
    h('div',{class:'pl'},h('span',{},'1. Vem Dançar Kuduro'),h('span',{},'5:03')));
  bPlay.onclick=()=>playMusic(); bPause.onclick=()=>audio.pause(); bStop.onclick=()=>{audio.pause();audio.currentTime=0};
  vol.oninput=()=>audio.volume=vol.value/100;
  seek.oninput=()=>{ if(audio.duration) audio.currentTime=seek.value/1000*audio.duration; };
  let raf; const g=cv.getContext('2d'); const data=new Uint8Array(64);
  const loop=()=>{ raf=requestAnimationFrame(loop);
    time.textContent=fmt(audio.currentTime); if(audio.duration && document.activeElement!==seek) seek.value=audio.currentTime/audio.duration*1000;
    const W=cv.width=cv.clientWidth||300, H=cv.height=46; g.clearRect(0,0,W,H);
    const n=28, bw=W/n; if(analyser) analyser.getByteFrequencyData(data);
    for(let k=0;k<n;k++){
      let v = analyser ? data[Math.floor(k*1.6)]/255 : (audio.paused?0:(.3+.5*Math.abs(Math.sin(performance.now()/180+k*1.7))));
      if(audio.paused&&!analyser) v=0;
      const bh=Math.max(2,Math.round(v*H/3)*3);
      for(let yy=H-3; yy>H-bh; yy-=3){ const t=(H-yy)/H; g.fillStyle=t>.75?'#ff3b3b':t>.5?'#ffd400':'#00e05a'; g.fillRect(k*bw+1,yy,bw-2,2); }
    }
  };
  loop();
  WM.open('player',{title:'Плеер',icon:ICON.player,w:340,h:330,body,nomax:true,x:Math.max(4,desk.clientWidth-350),y:8,onclose:()=>cancelAnimationFrame(raf)});
}
function playMusic(){
  audio.play().catch(()=>{});
}

/* ---------- minesweeper ---------- */
let msLosses=0;
function mines(){
  if(WM.wins.mines) return WM.restore('mines');
  const N=9,M=10; let grid,over,started,flags,t0,tid,revealed;
  const led1=h('div',{class:'led'}), led2=h('div',{class:'led'}), face=h('button',{class:'btn face','aria-label':'Новая игра'},'🙂');
  const board=h('div',{class:'board in',style:`grid-template-columns:repeat(${N},24px)`});
  const body=h('div',{class:'ms'},h('div',{class:'top in',style:'background:var(--face)'},led1,face,led2),board);
  face.onclick=reset;
  board.addEventListener('contextmenu',e=>e.preventDefault());
  function reset(){
    clearInterval(tid); over=false; started=false; flags=0; revealed=0; face.textContent='🙂'; led2.textContent='000';
    grid=[...Array(N*N)].map(()=>({m:false,r:false,f:false,n:0}));
    board.innerHTML='';
    grid.forEach((c,i)=>{ const d=h('div',{class:'c hid'}); c.el=d; board.append(d);
      let lp; d.addEventListener('pointerdown',e=>{ if(e.button===0) face.textContent='😮'; if(e.pointerType==='touch'){ lp=setTimeout(()=>{lp=null;flag(i)},420);} });
      d.addEventListener('pointerup',e=>{ face.textContent=over?face.textContent:'🙂'; if(e.pointerType==='touch'){ if(lp){clearTimeout(lp);open(i);} return;} if(e.button===0) open(i); if(e.button===2) flag(i); });
      d.addEventListener('pointerleave',()=>{ if(lp){clearTimeout(lp);lp=null;} });
    });
    upd();
  }
  const nb=i=>{ const x=i%N,y=i/N|0,r=[]; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const X=x+dx,Y=y+dy; if(X>=0&&Y>=0&&X<N&&Y<N) r.push(Y*N+X);} return r; };
  function plant(safe){ const ban=new Set([safe,...nb(safe)]); let k=0; while(k<M){ const i=Math.random()*N*N|0; if(ban.has(i)||grid[i].m) continue; grid[i].m=true; k++; }
    grid.forEach((c,i)=>c.n=nb(i).filter(j=>grid[j].m).length); }
  function upd(){ led1.textContent=String(M-flags).padStart(3,'0'); }
  function flag(i){ const c=grid[i]; if(over||c.r) return; c.f=!c.f; flags+=c.f?1:-1; c.el.textContent=c.f?'🚩':''; upd(); }
  function open(i){
    const c=grid[i]; if(over||c.r||c.f) return;
    if(!started){ started=true; plant(i); t0=Date.now(); tid=setInterval(()=>led2.textContent=String(Math.min(999,(Date.now()-t0)/1000|0)).padStart(3,'0'),250); }
    if(c.m){ lose(i); return; }
    const st=[i]; while(st.length){ const j=st.pop(), q=grid[j]; if(q.r||q.f) continue; q.r=true; revealed++;
      q.el.className='c rev'+(q.n?' n'+q.n:''); q.el.textContent=q.n||''; if(!q.n) nb(j).forEach(k=>{ if(!grid[k].r) st.push(k); }); }
    if(revealed===N*N-M) win();
  }
  function lose(i){ over=true; clearInterval(tid); face.textContent='😵'; msLosses++;
    grid.forEach(c=>{ if(c.m){ c.el.className='c rev'; c.el.textContent='💣'; } }); grid[i].el.classList.add('boom');
    if(msLosses===3) setTimeout(()=>{ msgBox('Сапёр','Ладно, ты старалась. Держи букву просто так:\n\nБуква 3 из 5: «Р»',ICON.info); giveLetter(2); },600);
  }
  function win(){ over=true; clearInterval(tid); face.textContent='😎';
    grid.forEach(c=>{ if(c.m){ c.el.textContent='🚩'; } });
    setTimeout(()=>{ msgBox('Сапёр','Победа, ты у меня такая умничка!!!\n\nБуква 3 из 5: «Р»',ICON.info); giveLetter(2); },300);
  }
  reset();
  WM.open('mines',{title:'Сапёр',icon:ICON.mine,w:N*24+30,h:N*24+108,body,nomax:true});
}

function msgBox(title,text,icon=ICON.info,then){
  const id='msg'+Date.now();
  const ok=h('button',{class:'btn'},'ОК');
  const t=h('div',{class:'dtext',style:'white-space:pre-line'},text);
  const dbody=h('div',{class:'dbody',html:icon.replace('<svg','<svg class="big"')}); dbody.append(t);
  const body=h('div',{class:'dlg'},dbody,h('div',{class:'btns'},ok));
  const rec=WM.open(id,{title,icon,w:360,h:180,body,nomax:true});
  rec.win.style.height='auto';
  rec.win.style.left=Math.max(2,(desk.clientWidth-rec.win.offsetWidth)/2)+'px'; rec.win.style.top=Math.max(2,(desk.clientHeight-rec.win.offsetHeight)/2.5)+'px';
  ok.onclick=()=>{ WM.close(id); then?.(); }; setTimeout(()=>ok.focus(),30);
}

/* ================= finale ================= */
function runInstaller(){
  if(WM.wins.inst) return WM.restore('inst');
  const pbar=h('div',{class:'pbar in'}), step=h('div',{class:'step'}), pct=h('b',{},'0%');
  const body=h('div',{class:'inst'},h('div',{},'Установка программы «С днём рождения» на устройство ',h('b',{},HER),'.'),step,pbar,h('div',{},'Выполнено: ',pct));
  WM.open('inst',{title:'Установка: С днём рождения',icon:ICON.exe,w:420,h:210,body,nomax:true});
  const steps=['Копирование обнимашек…','Распаковка поцелуев…','Установка хорошего настроения…','Настройка счастья на весь год…','Регистрация самой лучшей девушки…','Почти готово…'];
  let p=0; const cap=Math.max(1,Math.floor((pbar.clientWidth-6)/11));
  const tick=setInterval(()=>{
    p+= p<70?3:p<95?1.6:.5; if(p>=99){ p=99; clearInterval(tick); setTimeout(bsod,1600); }
    pct.textContent=Math.floor(p)+'%'; step.textContent=steps[Math.min(steps.length-1,Math.floor(p/17))];
    const want=Math.round(cap*p/100); while(pbar.children.length<want) pbar.append(h('i'));
  },110);
}
function bsod(){
  WM.close('inst');
  const b=h('div',{id:'bsod',role:'button',tabindex:'0'});
  b.innerHTML=`<div class="in2"><div class="hd">ЖеняOS</div>
  <div>Обнаружена критическая ошибка 17:11 по адресу СЕРДЦЕ:0812.<br>Причина: слишком много любви. Система не справляется.</div>
  <div class="big">С днём рождения, ${HER}!</div>
  <div>* Ты лучшее, что со мной случалось.<br>* Нажми любую клавишу, чтобы продолжить <span class="cur">_</span></div></div>`;
  document.body.append(b); b.focus();
  const go=()=>{ b.remove(); document.removeEventListener('keydown',go); finale(); };
  setTimeout(()=>{ b.addEventListener('click',go); document.addEventListener('keydown',go); },900);
}
function finale(){
  if(!S.done){ S.done=true; save(); buildDesktop(); }
  if(audio.paused) playMusic();
  Object.keys(WM.wins).forEach(k=>{ if(k!=='player') WM.close(k); });
  confetti();
  openNote('Подарок.txt',GIFT);
  { const g=WM.wins['n-Подарок.txt']; if(g){ g.win.style.left='100px'; g.win.style.top=Math.max(4,desk.clientHeight-g.win.offsetHeight-20)+'px'; } }
  setTimeout(()=>{ openNote('Письмо.txt',LETTER); const r=WM.wins['n-Письмо.txt']; if(r){ r.win.style.left=Math.max(4,(desk.clientWidth-r.win.offsetWidth)/2)+'px'; r.win.style.top='10px'; } },500);
}
function confetti(){
  if(reduce) return;
  const cv=$('#fx'); cv.hidden=false; const g=cv.getContext('2d');
  const W=cv.width=innerWidth, H=cv.height=innerHeight;
  const cols=['#d81b4a','#ff6f91','#ffd400','#1084d0','#00e05a','#ffffff'];
  const P=[...Array(160)].map(()=>({x:Math.random()*W,y:-20-Math.random()*H*.8,vy:1.5+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6.28,vr:-.1+Math.random()*.2,s:6+Math.random()*8,c:cols[Math.random()*cols.length|0],heart:Math.random()<.35}));
  const hp=new Path2D(HEART_D); const t0=performance.now();
  (function f(t){ g.clearRect(0,0,W,H); let alive=0;
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; if(p.y<H+20) alive++;
      g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=p.c;
      if(p.heart){ g.scale(p.s/28,p.s/28); g.translate(-16,-16); g.fill(hp);} else g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      g.restore(); }
    if(alive && t-t0<9000) requestAnimationFrame(f); else { cv.hidden=true; }
  })(t0);
}

function showLogin(){
  const lg=$('#login'); lg.hidden=false;
  const {dlg,input,bNo}=askPassword('login','');
  const user=h('input',{class:'field',id:'user',value:HER,readonly:''});
  const text=dlg.querySelector('.dtext');
  text.firstChild.textContent='Добро пожаловать в ЖеняOS. Введи пароль, чтобы войти.';
  text.insertBefore(h('div',{class:'row'},h('label',{for:'user'},'Пользователь:'),user), text.querySelector('.q'));
  text.querySelector('.q').textContent='Вопрос: '+LOCKS.login.q;
  bNo.remove();
  const box=h('div',{class:'out win act',style:'position:relative;width:min(470px,100%);left:auto;top:auto'},
    h('div',{class:'tb',html:ICON.key+'<span class="tt">Вход в ЖеняOS</span>'}),
    h('div',{class:'loginart',html:ICON.heart+'<div><b>ЖеняOS 98</b><br><small>BIRTHDAY EDITION</small></div>'}),
    dlg);
  box.querySelector('.tb svg').classList.add('ti');
  lg.append(box);
  // override ok behaviour for login
  const ok=dlg.querySelector('.btns .btn');
  const err=dlg.querySelector('.err'); let fails=0;
  const hintBox=dlg.querySelector('.hint');
  const go=()=>{
    if(LOCKS.login.check(ni.value)){ lg.remove(); enterDesktop(); return; }
    fails++; err.textContent=fails>1?'Неверно. Посмотри подсказку.':'Неверный пароль. Попробуй ещё, '+HER+'.';
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    if(fails>=2){ hintBox.hidden=false; hintBox.textContent='Подсказка: '+LOCKS.login.hint; }
  };
  const nok=ok.cloneNode(true); ok.replaceWith(nok); nok.onclick=go;
  const ni=input.cloneNode(true); input.replaceWith(ni); ni.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  setTimeout(()=>ni.focus(),50);
}

function enterDesktop(){
  desk.hidden=false; $('#bar').hidden=false;
  buildDesktop(); buildStart();
  setTimeout(()=>balloon('Добро пожаловать, '+HER+'!','Тут много интересного. Потыкай всё :)'),1200);
}
